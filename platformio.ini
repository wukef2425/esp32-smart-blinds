[env:esp32dev]
; Temporarily disable modules requiring secrets.h during servo development.
build_src_filter = +<*> -<wifi_manager.cpp> -<telemetry.cpp>
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
lib_deps =
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit BMP280 Library@2.6.8
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    https://github.com/madhephaestus/ESP32Servo.git#da69f242e813078db5cd05b8e385bb8a4d21fe64
    bblanchon/ArduinoJson@7.4.2
